<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/judge-home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ competition?.name || 'Competição' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-card *ngIf="competition">
    <ion-card-header>
      <ion-card-title>{{ competition.name }}</ion-card-title>
    </ion-card-header>
  </ion-card>

</ion-content>
